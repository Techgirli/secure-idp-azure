trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  AZURE_SUBSCRIPTION: 'your-subscription-id'
  ACR_LOGIN_SERVER: 'regXXXXXXXX.azurecr.io'
  GITOPS_REPO: 'https://github.com/yourorg/gitops-repo.git'

stages:
  - stage: Build
    displayName: 'Build & Scan'
    jobs:
      - job: BuildAndPush
        steps:
          - task: Docker@2
            displayName: Build & Push to ACR
            inputs:
              containerRegistry: 'ACR-Service-Connection'
              repository: 'payments-api'
              Dockerfile: 'Dockerfile'
              tags: |
                $(Build.BuildNumber)

          - script: |
              set -e
              # Pull the image locally for scanning
              docker pull ${ACR_LOGIN_SERVER}/payments-api:$(Build.BuildNumber)

              # Run Trivy scan
              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --ignorefile .trivyignore \
                ${ACR_LOGIN_SERVER}/payments-api:$(Build.BuildNumber)
            displayName: 'Trivy Image Scan'

          - task: AzureCLI@2
            displayName: 'Get Workload Identity Client ID'
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                CLIENT_ID=$(az identity show --name "idp-vault-reader" \
                  --resource-group "idp-rg" --query clientId -o tsv)
                echo "##vso[task.setvariable variable=WI_CLIENT_ID]$CLIENT_ID"

  - stage: Deploy
    displayName: 'GitOps Commit'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: CommitToGitOps
        steps:
          - task: Checkout@1
            inputs:
              repository: 'self'
              fetchDepth: 0

          - script: |
              set -e
              # Render Helm chart
              helm template payments-api ./helm-charts/payments-api \
                --namespace production \
                -f helm-charts/payments-api/values-production.yaml \
                --set image.tag=$(Build.BuildNumber) \
                --set workloadIdentity.clientId=$(WI_CLIENT_ID) \
                > gitops/apps/production/payments-api/rendered.yaml

              # Commit and push
              git config user.name "Azure DevOps Bot"
              git config user.email "devops-bot@example.com"
              git add gitops/apps/production/payments-api/rendered.yaml
              git commit -m "deploy: payments-api $(Build.BuildNumber)"
              git push
            displayName: 'Render & Commit to GitOps'
            env:
              GITOPS_TOKEN: $(GITOPS_PAT)

          - script: |
              # Force Argo CD sync (optional — auto-sync should pick it up)
              argocd app sync payments-api --server https://argocd.internal.example.com
            displayName: 'Trigger Argo CD Sync'
            condition: succeeded()   