apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "payments-api.fullname" . }}-kv
  labels:
    {{- include "payments-api.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId }}
    keyvaultName: "REPLACE_WITH_KV_NAME"
    objects: |
      array:
        {{- range .Values.secrets }}
        - secretName: {{ .key }}
          secretType: genericSecret
        {{- end }}
  secretObjects:
    - secretName: {{ include "payments-api.fullname" . }}-kv-secret
      type: Opaque
      data:
        {{- range .Values.secrets }}
        - objectName: {{ .key }}
          key: {{ .key }}
        {{- end }}   