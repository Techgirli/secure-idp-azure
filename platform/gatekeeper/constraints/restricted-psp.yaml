apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPPrivilegedContainer
metadata:
  name: disallow-privileged
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - argocd
      - gatekeeper-system
      - ingress-nginx
      - calico-system
      - cert-manager
      - tigera-operator
  parameters:
    exemptImages: []
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPCapabilities
metadata:
  name: drop-all-capabilities
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - argocd
      - gatekeeper-system
      - ingress-nginx
      - calico-system
      - cert-manager
      - tigera-operator
  parameters:
    requiredDropCapabilities:
      - ALL
    allowedCapabilities: []
    exemptImages: []
