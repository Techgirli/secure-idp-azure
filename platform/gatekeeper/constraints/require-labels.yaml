apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: require-team-and-env-labels
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
  message: "All Deployments must have 'team' and 'environment' labels"
  parameters:
    labels:
      - key: "team"
      - key: "environment"   