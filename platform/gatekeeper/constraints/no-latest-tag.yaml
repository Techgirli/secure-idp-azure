apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sImageDigests
metadata:
  name: require-image-digest
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - argocd
      - gatekeeper-system
      - ingress-nginx
      - calico-system
      - cert-manager
      - tigera-operator
  parameters:
    exemptImages:
      - "k8s.gcr.io/pause:*"
      - "registry.k8s.io/pause:*"
