apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: require-resource-limits
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  message: "All containers must define resource requests and limits"
  parameters:
    cpu:
      min: "100m"
      max: "4"
    memory:
      min: "128Mi"
      max: "4Gi"   