apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: require-resource-limits
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - argocd
      - gatekeeper-system
      - ingress-nginx
      - calico-system
      - cert-manager
      - tigera-operator
      - kube-public
      - kube-node-lease
  parameters:
    limits:
      - cpu
      - memory
    requests:
      - cpu
      - memory
